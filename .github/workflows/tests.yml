name: QC unit tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run unit tests
        run: python -m pytest -q
      - name: Smoke test public examples
        run: |
          python -m src.qc_router examples/sample_asr.json > /dev/null
          python -m src.speaker_alignment examples/sample_asr.json examples/sample_diarization.json > /dev/null
