name: STT QC pipeline checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt pytest-cov ruff
      - name: Static lint (undefined names and unused imports)
        run: ruff check --select F src app tests
      - name: Python syntax
        run: python -m compileall -q src app tests
      - name: Core and UI tests
        run: python -m pytest -q --cov=src --cov=app --cov-report=term-missing
      - name: Run sample QC and speaker alignment
        run: |
          python -m src.qc_router examples/sample_asr.json > /dev/null
          python -m src.speaker_alignment examples/sample_asr.json examples/sample_diarization.json > /dev/null
